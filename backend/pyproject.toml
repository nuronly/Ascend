[project]
name = "ladder-backend"
version = "0.1.0"
description = "阶梯计划 - 以疑问为原子单位的学习工作台 (后端)"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
    # 配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # 数据库 (SQLite 现在 / PostgreSQL 之后, 同一套模型)
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    # 鉴权
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    # LLM
    "httpx>=0.27.0",
    # 检索
    "jieba>=0.42.1",
    "numpy>=2.1.0",
    # 间隔重复
    "fsrs>=4.0.0",
    # 文档解析（v0.3）
    # ⚠️ 刻意不用 PyMuPDF：它是 AGPL-3.0，一旦对外提供网络服务
    #    就要开源全部代码。pdfplumber / pypdfium2 是 MIT / Apache。
    "pdfplumber>=0.11.4",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.2",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0", "pgvector>=0.3.6"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
